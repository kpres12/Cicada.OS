# systemd-sysusers will not invent the group named on the right of the colon —
# it requires GID 1000 to exist already, and without this line it does not, so
# the whole `u` line fails with "Failed to create cicada: please create GID
# 1000". The user then exists only because iso/overlay/.../etc/passwd writes it
# by hand, with a primary group that resolves to nothing: `id` reports
# gid=1000(1000) and `ls -l` shows a bare number.
#
# The `m` membership lines below were unaffected and did apply, which is why
# this stayed invisible — wheel, video, audio, rfkill and the rest were all
# correct while the primary group silently was not.
g cicada 1000
u cicada 1000:1000 "Cicada Live" /home/cicada /bin/bash
m cicada wheel
m cicada video
m cicada audio
m cicada storage
m cicada rfkill
m cicada users
m cicada network
m cicada input
