name: GitHub Pages

on:
  # Every push to main redeploys, not just pushes that touch site/. A path
  # filter kept the Actions tab showing a commit from hours ago while main had
  # moved on, which reads as "the push did not land" — and the cost of checking
  # that suspicion is far higher than the ~20s this job takes.
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
