name: reproducible-build

# The real "Reproducible build CI" item on docs/ROADMAP.md: build the actual
# ISO twice from the same commit and prove the images match. Deliberately not
# part of tests.yml — a full mkarchiso build downloads and installs the whole
# system twice (kernel, Hyprland, Helium, firmware), which is minutes of work
# and gigabytes of transfer even on a native amd64 runner, not something every
# push/PR should pay for. Runs on demand and once a week instead.
#
# ubuntu-latest is amd64 natively, so this runs Dockerfile.build/iso/build.sh
# without the --platform linux/amd64 QEMU translation the Mac-side
# scripts/build-iso-docker.sh needs — meaningfully faster than a local build
# on Apple Silicon.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC

jobs:
  build-twice-and-diff:
    runs-on: ubuntu-latest
    # Two full builds took 88 minutes on 2026-11-21 — 100 left no headroom for
    # a slow mirror. 180 let a hung build burn three runner-hours every
    # Monday for a month before anyone looked; 130 is the compromise.
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v5

      - name: Pin SOURCE_DATE_EPOCH to this commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Same timestamps are not enough: A and B used to pacstrap from live
      # rolling mirrors ~40 minutes apart, so any package pushed in between
      # made the images differ. A freezes the repo databases into pkg-snapshot
      # and B resolves against those same databases (CICADA_PKG_SNAPSHOT in
      # iso/build.sh); the shared pkg-cache means B installs the exact package
      # files A downloaded, without fetching them again.
      - name: Prepare shared package snapshot and cache
        run: mkdir -p pkg-snapshot pkg-cache

      - name: Build builder image
        run: docker build -f Dockerfile.build -t cicada-iso-builder .

      - name: Build A
        run: |
          mkdir -p out-a work-a
          docker run --rm --privileged \
            -e CICADA_OUT=/out -e CICADA_WORK=/work -e SOURCE_DATE_EPOCH -e CICADA_PKG_SNAPSHOT=/snapshot \
            -v "${PWD}:/src:ro" -v "${PWD}/out-a:/out" -v "${PWD}/work-a:/work" \
            -v "${PWD}/pkg-snapshot:/snapshot" -v "${PWD}/pkg-cache:/var/cache/pacman/pkg" \
            cicada-iso-builder

      - name: Build B
        run: |
          mkdir -p out-b work-b
          docker run --rm --privileged \
            -e CICADA_OUT=/out -e CICADA_WORK=/work -e SOURCE_DATE_EPOCH -e CICADA_PKG_SNAPSHOT=/snapshot \
            -v "${PWD}:/src:ro" -v "${PWD}/out-b:/out" -v "${PWD}/work-b:/work" \
            -v "${PWD}/pkg-snapshot:/snapshot" -v "${PWD}/pkg-cache:/var/cache/pacman/pkg" \
            cicada-iso-builder

      - name: Compare
        id: compare
        run: |
          # -not -type l: cicada-latest-x86_64.iso is a symlink alongside the
          # real dated ISO. A bare glob matches both, sha256sum gets two paths
          # glued into one bad argument, fails, and — because that failure is
          # inside a VAR=$(...) assignment, which `set -e` does not catch —
          # both hashes silently end up as empty strings that trivially
          # "match". Exactly that happened on the first run of this workflow.
          find_one() {
            local hits
            hits="$(find "$1" -maxdepth 1 -name 'cicada-*-x86_64.iso' -not -type l)"
            [[ "$(wc -l <<<"${hits}")" -eq 1 && -n "${hits}" ]] \
              || { echo "expected exactly one dated ISO in $1, found: ${hits:-<none>}" >&2; exit 1; }
            printf '%s' "${hits}"
          }
          iso_a="$(find_one out-a)"
          iso_b="$(find_one out-b)"
          sha_a="$(sha256sum "${iso_a}" | cut -d' ' -f1)"
          sha_b="$(sha256sum "${iso_b}" | cut -d' ' -f1)"
          [[ "${sha_a}" =~ ^[0-9a-f]{64}$ ]] || { echo "sha_a did not come back as a real sha256: '${sha_a}'" >&2; exit 1; }
          [[ "${sha_b}" =~ ^[0-9a-f]{64}$ ]] || { echo "sha_b did not come back as a real sha256: '${sha_b}'" >&2; exit 1; }
          echo "A: ${iso_a} ${sha_a}"
          echo "B: ${iso_b} ${sha_b}"
          if [[ "${sha_a}" == "${sha_b}" ]]; then
            echo "REPRODUCIBLE: both builds match bit-for-bit"
          else
            echo "NOT REPRODUCIBLE: builds differ — see byte offset below"
            cmp "${iso_a}" "${iso_b}" || true
            exit 1
          fi

      # A bare "differ: byte N" is what kept this red for weeks — nobody could
      # tell which file moved. Name it, and keep the report.
      - name: Explain the difference
        if: failure() && steps.compare.outcome == 'failure'
        run: |
          docker run --rm --privileged --entrypoint bash \
            -v "${PWD}:/w" -w /w cicada-iso-builder \
            scripts/repro-diff.sh \
              "$(find out-a -maxdepth 1 -name 'cicada-*-x86_64.iso' -not -type l)" \
              "$(find out-b -maxdepth 1 -name 'cicada-*-x86_64.iso' -not -type l)" \
              work-a/mkarchiso work-b/mkarchiso | tee repro-diff.txt

      - name: Upload difference report
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: repro-diff
          path: repro-diff.txt
