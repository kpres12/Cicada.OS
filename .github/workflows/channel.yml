name: cicada-stable

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: lockfile stem (cicada-stable-YYYY.MM.DD)
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ${{ }} is substituted into the script BEFORE the shell sees it, so an
      # input containing shell metacharacters executes as part of the command.
      # Passing it through env makes the shell treat it as data. Only a user with
      # write access can dispatch this workflow, so this is hardening rather than
      # an open hole, but the pattern is the one that goes wrong elsewhere.
      - name: Check lockfile exists
        env:
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
        run: |
          case "$SNAPSHOT" in
            cicada-stable-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]) ;;
            *) echo "refusing snapshot name: $SNAPSHOT" >&2; exit 1 ;;
          esac
          test -f "channel/${SNAPSHOT}.pkglist.txt"
      - name: Promote CURRENT
        env:
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
        run: ./scripts/channel-promote.sh "$SNAPSHOT"
      - name: Note
        run: echo "Blob repo (repo-add) is not wired. This only moves the pin pointer."
