[device]
# broadcom-wl's `wl` module (the only driver for the MBA's BCM4360) exposes a
# partial cfg80211 surface. iwd requires full nl80211 and will not drive it —
# the device simply never shows up. wpa_supplicant is the backend that works
# on this hardware. Intel/Atheros cards work with either.
wifi.backend=wpa_supplicant
# `wl` does not implement scan-time MAC randomization. Leaving this on makes
# every scan fail, which looks exactly like "no networks found". Connection-time
# randomization below still applies — that is the property that matters on air.
wifi.scan-rand-mac-address=no

[main]
dns=systemd-resolved
plugins=keyfile

[connection]
# Belt and braces with Domains=~. in resolved: do not even hand DHCP's
# resolver to systemd-resolved as a per-link server.
ipv4.ignore-auto-dns=true
ipv6.ignore-auto-dns=true
wifi.powersave=2
wifi.cloned-mac-address=random
# Randomizing the MAC and then announcing a stable hostname in every DHCP
# request hands the network a persistent identifier and undoes the whole
# point. Every AP you have ever joined otherwise learns 'cicada' came back.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# Both must DERIVE from the randomized MAC, not persist across it. A stable
# DUID or client-id is a fresh persistent identifier that survives every MAC
# rotation and re-links you across networks — worse than sending nothing.
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ethernet.cloned-mac-address=random

[connectivity]
enabled=false
uri=
interval=0
