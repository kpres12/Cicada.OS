[device]
# broadcom-wl's `wl` module (the only driver for the MBA's BCM4360) exposes a
# partial cfg80211 surface. iwd requires full nl80211 and will not drive it —
# the device simply never shows up. wpa_supplicant is the backend that works
# on this hardware. Intel/Atheros cards work with either.
wifi.backend=wpa_supplicant
# `wl` does not implement scan-time MAC randomization. Leaving this on makes
# every scan fail, which looks exactly like "no networks found". Connection-time
# randomization below still applies — that is the property that matters on air.
wifi.scan-rand-mac-address=no

[main]
dns=systemd-resolved
plugins=keyfile

[connection]
# Do NOT put ipv4.ignore-auto-dns here — NetworkManager rejects it as an
# unknown key in conf.d and logs on every boot (seen in cicada-wifi-diag).
# DNS policy is systemd-resolved Domains=~. (see resolved.conf.d).
wifi.powersave=2
# Default to permanent MAC on this hardware — Broadcom `wl` often fails
# association when NetworkManager randomizes the MAC (EMFILE / timeout).
# cicada-wifi can still offer per-network randomization where it works.
wifi.cloned-mac-address=permanent
# Do not announce a stable hostname in DHCP.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv4.dhcp-client-id=mac
ipv6.dhcp-duid=ll
ethernet.cloned-mac-address=permanent

[connectivity]
enabled=false
uri=
interval=0
