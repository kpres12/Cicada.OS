# Authenticated network time.
#
# Plaintext NTP is trivially spoofable by anyone on-path. Moving a client's
# clock forward past a certificate's expiry, or backward before a revocation,
# turns TLS verification into a formality — it is a real attack, not a
# theoretical one, and it is why GrapheneOS ships authenticated time.
#
# NTS (RFC 8915) authenticates the time source. Three independent operators in
# three jurisdictions, so no single one can move the clock alone and a
# disagreement is visible rather than silent.
server time.cloudflare.com iburst nts
server nts.netnod.se        iburst nts
server ptbtime1.ptb.de      iburst nts

# Unauthenticated fallback. Deliberate, and here is the reasoning:
#
# Knowing the time leaks nothing. The risk of plaintext NTP is that an on-path
# attacker moves the clock to bypass certificate expiry. But a machine with NO
# time is *guaranteed* broken — every HTTPS site throws a certificate error,
# pacman rejects signatures, and Tor refuses to build circuits, because consensus
# documents are time-boxed. That failure also teaches the user to click through
# certificate warnings, which is the single worst habit this OS could instil.
#
# NTS-KE runs on port 4460, which campus, hotel and censored networks routinely
# block. Requiring it there means the machine simply does not work. So: prefer
# authenticated time, accept unauthenticated time rather than have none, and
# bound the damage with maxchange below plus majority agreement across sources.
# `cicada-status` reports which is actually in use, so degraded is visible
# rather than silent.
pool 2.pool.ntp.org iburst maxsources 3

# prefer, not require: authenticated sources win when they are reachable.
authselectmode prefer

# Cap how far a single adjustment may move the clock once we are synchronised:
# a source that wants to jump us by more than a day at that point is broken or
# hostile. The three fields are threshold, delay, limit — and all three matter:
#
#   delay 5   the check only starts after 5 updates, so the FIRST sync may make
#             an arbitrarily large correction. This machine is a 10-year-old
#             laptop whose PRAM battery may be dead and which boots amnesic with
#             no saved drift, so the RTC can legitimately be months out.
#   limit -1  never exit. A positive limit (or 0) makes chronyd *give up and
#             quit* on an oversized offset, which leaves the clock wrong AND
#             unsynchronised — the worst of both, and it presents as "every
#             HTTPS site has a certificate error" with no obvious cause.
maxchange 86400 5 -1

# Step rather than slew for the first few updates, so a wrong RTC is corrected
# in one jump instead of drifting into place over hours.
makestep 1.0 5

driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
leapsectz right/UTC
logdir /var/log/chrony
# Never act as a server for anyone else.
port 0
cmdport 0
