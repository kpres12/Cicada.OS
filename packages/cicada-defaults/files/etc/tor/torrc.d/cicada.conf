# Cicada Tor configuration.
#
# Bound to the onion namespace's host address only — never to a physical
# interface, so nothing outside this machine can use it as an open proxy.

SocksPort 10.71.0.1:9050 IsolateDestAddr IsolateDestPort
TransPort 10.71.0.1:9040
DNSPort   10.71.0.1:9053

# Stream isolation: different destinations get different circuits, so two sites
# cannot be trivially linked by sharing an exit.
SocksPort 127.0.0.1:9050 IsolateDestAddr IsolateDestPort

# Never act as a relay or exit. A client that relays for others is louder on the
# network and, in some jurisdictions, legally exposed.
ClientOnly 1
ExitRelay 0
SocksPolicy accept 10.71.0.0/30
SocksPolicy accept 127.0.0.0/8
SocksPolicy reject *

# Do not write the state of who you talked to any longer than needed.
AvoidDiskWrites 1
SafeLogging 1
Log notice syslog

# --- Bridges -----------------------------------------------------------------
# Uncomment and fill via `cicada-tor bridges` when connecting directly to the
# Tor network is blocked or dangerous. Without a pluggable transport, anyone
# watching your link can see that you are using Tor, which in some places is
# itself the thing that gets you hurt. obfs4 makes the traffic look like nothing
# in particular.
#
# Get bridges: https://bridges.torproject.org  or  email bridges@torproject.org
# from a Gmail/Riseup address with the body: get transport obfs4
#
# ClientTransportPlugin obfs4 exec /usr/bin/obfs4proxy
# UseBridges 1
# Bridge obfs4 <ip>:<port> <fingerprint> cert=<cert> iat-mode=0
%include /etc/cicada/tor-bridges.conf
