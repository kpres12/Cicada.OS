d /var/lib/cicada 0750 root root -
d /run/cicada 0755 root root -

# Thumbnail caches are the Linux Thumbs.db: full-resolution-enough copies of
# every image ever opened, including from media that has since been removed.
# Wipe at boot, then keep the directory as a symlink target under tmpfs.
R! /home/cicada/.cache/thumbnails - - - -
R! /root/.cache/thumbnails - - - -

# GTK/Qt file-open history (paths + timestamps for files no longer present).
r! /home/cicada/.local/share/recently-used.xbel - - - -
r! /root/.local/share/recently-used.xbel - - - -

