[Journal]
# Logs are a timeline. /var/log/journal survives a seizure; /run does not.
# Storage=volatile keeps the journal in RAM only — it dies with the machine,
# the same way the live overlay does.
Storage=volatile
RuntimeMaxUse=32M
MaxRetentionSec=0
# Do not hand the timeline to a second sink.
ForwardToSyslog=no
ForwardToWall=no
Seal=no
