# Memory relief WITHOUT a disk artifact.
#
# "No swap" was never the goal — the goal is that nothing pages key material or
# plaintext to persistent storage. zram is a compressed block device backed by
# RAM: it is destroyed at power-off, cannot be imaged, and never touches the
# SSD. An 8GB Air running Hyprland and a browser needs this; without it the OOM
# killer takes the browser and the machine feels broken.
#
# writeback is deliberately NOT configured — that is the one setting that would
# let zram spill to disk and reintroduce exactly the artifact we are avoiding.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
