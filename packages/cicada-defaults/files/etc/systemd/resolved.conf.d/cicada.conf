[Resolve]
LLMNR=no
MulticastDNS=no
DNSSEC=allow-downgrade

# Encrypted DNS to Quad9 (Swiss non-profit, audited no-log, no account).
#
# systemd-resolved speaks DNS-over-TLS, not DNS-over-HTTPS — the browser does
# DoH to the same operator separately. Both endpoints are Quad9's malware-
# blocking, DNSSEC-validating service.
#
# Addresses are literal on purpose: a hostname here would need DNS to resolve
# the DNS server. The #dns.quad9.net suffix is the certificate name resolved
# pins the TLS session to, so a network that redirects 9.9.9.9 fails the
# handshake instead of silently answering.
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net

# opportunistic, not strict: on a captive-portal network the portal must be
# reachable to log in at all, and strict mode makes that a bricked connection
# rather than an inconvenience. See cicada-portal for the deliberate,
# time-boxed way to drop to plaintext for a portal.
#
# The exposure this leaves is a downgrade attack by someone already positioned
# to tamper with your traffic on the local network. Set this to `yes` if you
# never use captive-portal networks and want that closed.
DNSOverTLS=opportunistic

# Ignore DNS servers handed out by DHCP. Without this, joining campus Wi-Fi
# silently appends their resolver and lookups leak to it.
Domains=~.
