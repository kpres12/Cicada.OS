[Login]
# Lid close locks immediately. It does not suspend — see sleep.conf.d/cicada.conf.
# cicada-locked-reboot then drops the machine to BFU (keys gone from RAM) after
# CICADA_LID_REBOOT_SEC, which is much shorter than the open-lid timeout because
# a closed lid means the machine is in a bag, not in front of you.
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=lock
# Power button locks rather than powering off mid-work; hold it for a hard cut.
HandlePowerKey=lock
# Do not let an application hold the lock/idle inhibitor forever.
InhibitDelayMaxSec=5
