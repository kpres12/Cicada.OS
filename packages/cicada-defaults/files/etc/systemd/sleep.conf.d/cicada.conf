[Sleep]
# Suspend-to-RAM keeps the volume key live in memory indefinitely. A machine
# seized with the lid shut is the single most common real-world capture, and in
# that state it is After-First-Unlock: the key is sitting in DRAM waiting to be
# read over DMA or recovered by a warm reboot. There is no software fix for
# that — the only answer is not to be in that state.
#
# Hibernation is refused too: it writes the same key material to disk, and
# Cicada has no encrypted swap to write it into.
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
