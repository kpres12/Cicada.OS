[Coredump]
# A core dump is a copy of a process's memory written to disk. For a browser,
# a password manager, or anything holding a decrypted key, that is the exact
# material the rest of this OS exists to protect — landing in
# /var/lib/systemd/coredump in plaintext, surviving reboot, and sitting on the
# disk for a forensic examiner to find with no effort at all.
#
# Storage=none keeps crash *reporting* (the journal still records that a process
# died and why) while never writing memory contents anywhere.
Storage=none
ProcessSizeMax=0
