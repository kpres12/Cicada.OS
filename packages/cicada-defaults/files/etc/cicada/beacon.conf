# cicada-beacon — where a statement about this laptop is allowed to go.
#
# Transports are tried left to right and the first success wins. Nothing here
# is on by default in a way that reaches the network: meshtastic needs a radio
# you plugged in, file needs a path you chose, qr needs you looking at the
# screen. There is no server, no account, and no fallback that phones home.
#
#   meshtastic   LoRa text via the meshtastic CLI. Works with the Wi-Fi off and
#                the SIM out, which is the point.
#   file         append the token to BEACON_FILE. Point it at a USB stick, or
#                at a directory something else carries off the machine.
#   qr           draw the token on the terminal for the witness device to scan.
#                No infrastructure at all; the slowest and the most reliable.
#   stdout       print it. For scripts and for tests.
#
# If none of them delivers, cicada-beacon exits 2 and says which it tried. It
# does not report a beacon it did not send.
TRANSPORTS=meshtastic,qr

# Used only when "file" is in the list above.
#BEACON_FILE=/run/media/cicada/WITNESS/cicada-beacon.log
