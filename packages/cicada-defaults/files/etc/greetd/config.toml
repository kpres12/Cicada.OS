# Cicada.OS — greetd (installed systems). Live USB keeps getty autologin.
[terminal]
vt = 1

[default_session]
# Only Cicada-branded sessions (no raw Hyprland/Sway/niri .desktop from Arch).
# Default Exec: cicada-login (Settings → Desktop session prefers Sway/niri).
command = "tuigreet --time --remember --asterisks --greeting 'Cicada.OS' --sessions /usr/share/cicada/wayland-sessions --cmd cicada-login"
user = greeter
