# Uncommon protocol / DMA stacks. Do not blacklist bluetooth or wl (MBA Wi-Fi).
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist firewire-core
blacklist firewire_ohci

# Thunderbolt is a PCIe tunnel: a hostile device plugged into a running machine
# can DMA the memory holding your LUKS key. IOMMU is the proper mitigation, but
# it is not always on (the Apple iGPU forces intel_iommu off the default entry),
# and pre-TB3 hardware has no security levels at all. Refusing to load the
# driver closes the hotplug path outright, on every machine, at no cost to a
# laptop that is not using a TB dock.
# Opt back in: /etc/modprobe.d/cicada-thunderbolt-allow.conf with the same
# lines and `install` overrides removed.
blacklist thunderbolt
blacklist thunderbolt_net
install thunderbolt /bin/true
install thunderbolt_net /bin/true
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true

# Broadcom: `wl` (broadcom-wl) drives the MBA's BCM4360 and refuses to bind if
# an in-kernel driver claimed the PCI device first. broadcom-wl ships its own
# blacklist; restate it here so the policy is visible and survives packaging.
# brcmfmac is deliberately NOT blacklisted — it is the correct driver for the
# BCM43602 found in some 2017 Airs.
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma
blacklist brcmsmac
