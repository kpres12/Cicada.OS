# Uncommon protocol / DMA stacks. Do not blacklist bluetooth or wl (MBA Wi-Fi).
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist firewire-core
blacklist firewire_ohci
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true

# Broadcom: `wl` (broadcom-wl) drives the MBA's BCM4360 and refuses to bind if
# an in-kernel driver claimed the PCI device first. broadcom-wl ships its own
# blacklist; restate it here so the policy is visible and survives packaging.
# brcmfmac is deliberately NOT blacklisted — it is the correct driver for the
# BCM43602 found in some 2017 Airs.
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma
blacklist brcmsmac
