# Cicada Files — pcmanfm-qt as a real file manager (Places / Trash / New Folder),
# painted in void + amber (Star Wars console × Eva HUD). Not Ubuntu Yaru.

[Desktop]
# pcmanfm --desktop is opaque over hyprpaper. The art must live HERE or the
# desk is a black void and "wallpaper doesn't load" is the correct complaint.
Wallpaper=/usr/share/cicada/wallpapers/cicada-3301.png
WallpaperMode=stretch
DesktopIconSize=56
ShowHidden=false
FgColor=#ffb000
BgColor=#000000
ShadowColor=#000000
HideItems=false
# Home + Trash on the desk — Ubuntu-shaped discoverability, Cicada colors.
DesktopShortcuts=Home,Trash

[System]
Terminal=kitty
Archiver=file-roller
FallbackIconThemeName=Papirus-Dark
IconThemeName=Papirus-Dark
SIUnit=false

[Behavior]
SingleWindowMode=false
ConfirmDelete=true
ConfirmTrash=false
QuickExec=true
UseTrash=true
SingleClick=false
NoUsbTrash=false
SelectNewFiles=true

[Volume]
MountOnStartup=true
MountRemovable=true
AutoRun=false

[FolderView]
Mode=icon
ShowHidden=false
SortOrder=ascending
SortColumn=name
SortFolderFirst=true
BigIconSize=64
SmallIconSize=24
SidePaneIconSize=24
ThumbnailIconSize=128

[Window]
# Places sidebar always on — Home, Desktop, Documents, Trash, devices.
RememberWindowSize=true
FixedWidth=960
FixedHeight=640
LastWindowWidth=960
LastWindowHeight=640
SplitterPos=220
SidePaneMode=places
SidePaneVisible=true
ShowMenuBar=true
AlwaysShowTabs=false
ShowTabClose=true
PathBarButtons=true

[Thumbnail]
ShowThumbnails=true
MaxThumbnailFileSize=4096
ThumbnailLocalFilesOnly=true

[Places]
ShowTrash=true
ShowApplications=false
ShowDesktop=true
ShowHome=true
ShowComputer=true
ShowNetwork=false
