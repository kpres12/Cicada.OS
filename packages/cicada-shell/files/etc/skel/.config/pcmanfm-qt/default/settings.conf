[Desktop]
# hyprpaper paints the art. Desktop layer stays solid void so icons stay readable
# if hyprpaper dies — avoids double-stretch fighting the wallpaper stack.
Wallpaper=
WallpaperMode=color
DesktopIconSize=56
ShowHidden=false
FgColor=#ffb000
BgColor=#000000
ShadowColor=#000000
HideItems=false

[System]
Terminal=kitty
Archiver=file-roller
FallbackIconThemeName=Papirus-Dark

[Behavior]
SingleWindowMode=false
ConfirmDelete=true
QuickExec=true
