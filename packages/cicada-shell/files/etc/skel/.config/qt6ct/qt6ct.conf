[Appearance]
# Must be true or cicada-dark.conf is ignored and Files looks like stock Qt.
custom_palette=true
icon_theme=Papirus-Dark
standard_dialogs=default
style=Fusion
color_scheme_path=/usr/share/cicada/qt6ct/cicada-dark.conf

[Interface]
buttonbox_layout=0
cursor_flash_time=1000
double_click_interval=400
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3
