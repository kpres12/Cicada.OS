# Cicada.OS — Hyprland
# Visual language: Sentry HUD + Eva MAGI + OT consoles
# See docs/DESIGN.md

monitor=,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sh -c 'killall waybar 2>/dev/null; waybar'
exec-once = hyprpaper
exec-once = pcmanfm-qt --desktop
exec-once = hyprpolkitagent
exec-once = swaync
exec-once = xdg-user-dirs-update
exec-once = nwg-dock-hyprland -i 42 -ml 6 -p left -x -c "wofi --show drun"
exec-once = nm-applet --indicator
exec-once = hypridle
exec-once = cicada-firstboot

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
    sensitivity = 0
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(39ff14ee)
    col.inactive_border = rgba(1a1f24aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 0.97
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = cicada, 0.22, 1, 0.36, 1
    animation = windows, 1, 2, cicada, popin 92%
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, cicada, slide
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = JetBrainsMono Nerd Font
    background_color = rgb(0, 0, 0)
}

$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, W, exec, chromium
bind = $mainMod, N, exec, cicada-wifi
bind = $mainMod, V, togglefloating,
bind = $mainMod, T, togglefloating,
bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, L, exec, cicada-lock
bind = $mainMod, I, exec, kitty --title CICADA-SCOPES -e cicada-scopes
bind = $mainMod, slash, exec, kitty --title CICADA-KEYS -e less /usr/share/cicada/keys.txt
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, R, exec, cicada-radios-toggle
bind = $mainMod SHIFT, P, exec, cicada-profile list
bind = $mainMod SHIFT, I, exec, kitty --title CICADA-SCOPES -e cicada-scopes
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# Duress beacon is not bound — run `cicada-beacon` from a terminal when you mean it.

bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Dialogs float. Everything else tiles (dwindle). Drive the shell with the mouse.
windowrule = match:title pcmanfm-desktop, float off, fullscreen on
windowrule = match:title ^(CICADA-SCOPES)$, float on, size 780 420, center on
windowrule = match:title ^(CICADA-NET)$, float on, size 920 560, center on
windowrule = match:title ^(CICADA-KEYS)$, float on, size 640 420, center on
windowrule = match:class ^zenity$, float on, center on
windowrule = match:class ^nm-connection-editor$, float on, center on

source = ~/.config/hypr/cicada-theme.conf
