# Cicada.OS — compositor config (engine: Hyprland; product name is Cicada)
# Visual language: Sentry HUD + Eva MAGI + OT consoles
# See docs/DESIGN.md

source = ~/.config/hypr/monitors.conf

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = cicada-desktop-trust
exec-once = sh -c 'killall waybar 2>/dev/null; waybar'
exec-once = cicada-wallpaper
exec-once = pcmanfm-qt --desktop
exec-once = hyprpolkitagent
exec-once = swaync
exec-once = xdg-user-dirs-update
exec-once = cicada-dock
exec-once = hypridle
# Runs once on an installed system, then marks itself done. Exits
# immediately on live (no LUKS to enrol against) and never blocks login.
exec-once = sh -c 'sleep 8; cicada-firstrun'

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = HYPRCURSOR_THEME,Adwaita
env = XDG_CURRENT_DESKTOP,Cicada:Cicada.OS
env = XDG_SESSION_DESKTOP,Cicada
env = QT_QPA_PLATFORMTHEME,qt6ct
# Launcher monopoly: Cicada catalog first. Pickers still use cicada-wofi.
env = XDG_DATA_DIRS,/usr/share/cicada/launchers:/usr/local/share:/usr/share

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
    sensitivity = 0
}

general {
    gaps_in = 4
    # left gap = dock exclusive zone so tiles and desktop icons are not covered
    gaps_out = 10, 10, 10, 72
    border_size = 1
    col.active_border = rgba(39ff14ee)
    col.inactive_border = rgba(1a1f24aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = JetBrainsMono Nerd Font
    background_color = rgb(0, 0, 0)
}

$mainMod = SUPER

bind = $mainMod, RETURN, exec, cicada-run org.cicada.kitty -- kitty
bind = $mainMod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mainMod, E, exec, cicada-files
bind = $mainMod, T, exec, cicada-run org.cicada.kitty -- kitty
bind = $mainMod, W, exec, /usr/local/bin/chromium
bind = $mainMod, N, exec, cicada-run org.cicada.wifi -- cicada-wifi
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, cicada-wofi
bind = $mainMod, B, exec, cicada-wallpapers
bind = $mainMod, L, exec, cicada-lock
bind = $mainMod SHIFT, P, exec, cicada-power
bind = $mainMod, I, exec, cicada-run org.cicada.kitty -- kitty --title CICADA-SCOPES -e cicada-scopes
bind = $mainMod, slash, exec, cicada-run org.cicada.start -- kitty --title CICADA-START -e less /usr/share/cicada/FIRST-BOOT.txt
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, P, exec, cicada-profile list
bind = $mainMod SHIFT, I, exec, cicada-run org.cicada.kitty -- kitty --title CICADA-SCOPES -e cicada-scopes
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
# Duress beacon is not bound — run `cicada-beacon` from a terminal when you mean it.

bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
# Needs hid-apple fnmode=1 (shipped) so the printed brightness keys emit these.
bindel = , XF86MonBrightnessUp, exec, cicada-brightness up 5
bindel = , XF86MonBrightnessDown, exec, cicada-brightness down 5

# Dialogs float. Desktop is a layer, not a fullscreen window over the dock.
# Do not nofocus pcmanfm-desktop — that makes desktop icons unclickable.
# No rule for wofi: it is a layer-shell surface, not a toplevel, so windowrule
# never matched it and the 720x560 that used to sit here was a lie. Launcher
# geometry lives in ~/.config/wofi/config (width / lines).
windowrule = match:class ^zenity$, float on, center on
windowrule = match:title pcmanfm-desktop, float on, pin on
windowrule = match:title ^(CICADA-SCOPES)$, float on, size 780 420, center on
windowrule = match:title ^(CICADA-KEYS)$, float on, size 640 420, center on
windowrule = match:title ^(CICADA-INSTALL)$, float on, size 900 600, center on
windowrule = match:title ^(CICADA-START)$, float on, size 820 560, center on

source = ~/.config/hypr/cicada-theme.conf
