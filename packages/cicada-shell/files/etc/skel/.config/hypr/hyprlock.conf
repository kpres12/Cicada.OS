# Cicada lock — MAGI-03
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/cicada/wallpapers/cicada-3301.png
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = CICADA // MAGI-03
    color = rgba(57, 255, 20, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 22
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +'%Y-%b-%d %H:%M')</span>"
    color = rgba(255, 176, 0, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(0, 0, 0, 1.0)
    outer_color = rgba(255, 176, 0, 1.0)
    font_color = rgba(57, 255, 20, 1.0)
    fade_on_empty = false
    placeholder_text = <i>PASSPHRASE</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    rounding = 0
    capslock_color = rgba(255, 59, 0, 1.0)
}
