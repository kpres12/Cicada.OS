# MAGI-03 // SESSION LOCKED
#
# Console grammar (docs/DESIGN.md): a label tab over a hairline rule, one large
# amber readout, one input, one legend row. Nothing here reacts to media, and
# nothing here renders the session behind it.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    # A static plate, never `path = screenshot`. Blurring the running session
    # is still rendering it: window titles, message previews and document text
    # survive a blur pass well enough to read, and this screen is shown to
    # whoever is standing in front of an unattended machine.
    path = /usr/share/cicada/wallpapers/cicada-3301.png
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

# ---- Label tab -------------------------------------------------------------
shape {
    monitor =
    size = 330, 26
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = rgba(196, 92, 38, 1.0)
    rounding = 0
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = MAGI-03 // SESSION LOCKED
    color = rgba(255, 176, 0, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 12
    position = 0, 250
    halign = center
    valign = center
}

# ---- Primary readout -------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(255, 176, 0, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 64
    position = 0, 155
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%Y-%b-%d'
    color = rgba(196, 92, 38, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    position = 0, 95
    halign = center
    valign = center
}

# ---- Authentication --------------------------------------------------------
input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(0, 0, 0, 1.0)
    outer_color = rgba(255, 176, 0, 1.0)
    font_color = rgba(57, 255, 20, 1.0)
    fade_on_empty = false
    placeholder_text = <i>PASSPHRASE</i>
    # Shoulder-surfing defence, the passphrase analogue of GrapheneOS PIN
    # scrambling: with dots shown, anyone watching learns the exact length,
    # which is most of the work when the passphrase is generated and fixed-form.
    # Nothing is drawn per keystroke.
    hide_input = true
    position = 0, -20
    halign = center
    valign = center
    rounding = 0
    capslock_color = rgba(255, 59, 0, 1.0)

    # Without these a rejected passphrase looks identical to a frozen machine,
    # which is exactly how a wrong keystroke reads as "the OS hung".
    fail_text = <b>DENIED</b> ($ATTEMPTS)
    fail_color = rgba(255, 59, 0, 1.0)
    fail_timeout = 1500
    check_color = rgba(255, 176, 0, 1.0)
}

# ---- Legend rule -----------------------------------------------------------
shape {
    monitor =
    size = 420, 1
    color = rgba(26, 31, 36, 1.0)
    border_size = 0
    rounding = 0
    position = 0, -80
    halign = center
    valign = center
}

# Mission time only. No now-playing, no notification counts, no hostname: every
# line on this screen is read by whoever picked the machine up, not by the owner.
label {
    monitor =
    text = cmd[update:10000] date -u +'ZULU %H:%MZ'
    color = rgba(196, 92, 38, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    position = 0, -105
    halign = center
    valign = center
}
