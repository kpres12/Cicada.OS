general {
    lock_cmd = pidof hyprlock || cicada-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Live USB has no password — do not spam "Lock disabled" every 5 minutes.
listener {
    timeout = 300
    on-timeout = sh -c 'test -e /run/cicada/live-nopasswd || loginctl lock-session'
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
