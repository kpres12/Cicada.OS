# MAGI-03 fallback lock.
#
# Deliberately the smallest config that still authenticates: no shape blocks,
# no cmd[] labels, no wallpaper path that may have been deleted. cicada-lock
# falls back to this when the user's hyprlock.conf fails to bring a lock screen
# up, because the alternative is hyprlock exiting and the session unlocking
# itself. Locking must fail closed.
#
# Do not add features here. Every line is a chance for this file to fail too.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

label {
    monitor =
    text = MAGI-03 // SESSION LOCKED
    color = rgba(255, 176, 0, 1.0)
    font_family = monospace
    font_size = 14
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    inner_color = rgba(0, 0, 0, 1.0)
    outer_color = rgba(255, 176, 0, 1.0)
    font_color = rgba(57, 255, 20, 1.0)
    font_family = monospace
    fade_on_empty = false
    placeholder_text = PASSPHRASE
    hide_input = true
    position = 0, -20
    halign = center
    valign = center
    rounding = 0
    fail_text = DENIED ($ATTEMPTS)
    fail_color = rgba(255, 59, 0, 1.0)
}
